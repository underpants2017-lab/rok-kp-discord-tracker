name: Daily ProKingdoms KP Sync

on:
  schedule:
    # Runs automatically every day at 00:15 UTC (right after the in-game reset)
    - cron: '15 0 * * *'
  workflow_dispatch: # Allows you to manually trigger it anytime with one click

jobs:
  sync-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Fetch Stats and Post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python tracker.py
